[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-base"
version = "0.1.0"
description = "Pinned OpenViking personal memory deployment and host gateway"
requires-python = ">=3.12,<3.13"
dependencies = ["openviking==0.4.23", "openviking-sdk==0.1.13", "mcp==1.30.0", "llama-cpp-python==0.3.36"]

[project.scripts]
memory-base = "memory_base.deploy:main"

[tool.setuptools]
packages = ["memory_base"]
package-dir = {"memory_base" = "."}

[tool.setuptools.package-data]
memory_base = ["requirements.txt", "skill/SKILL.md"]
