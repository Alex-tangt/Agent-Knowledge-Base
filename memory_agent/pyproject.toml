[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-agent"
version = "0.1.0"
description = "Agent 长期记忆能力包：Markdown 真相源 + 派生索引 + MCP（search/get/add/supersede/archive/reindex）"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "ragcore",
    "python-dotenv",
]

[project.scripts]
memory-agent = "memory_agent.mcp_server:main"
memory-agent-proxy = "memory_agent.proxy:main"
memory-agent-build-index = "memory_agent.build_index:main"
memory-agent-connect = "memory_agent.connect:main"

[tool.setuptools]
packages = [
    "memory_agent",
    "memory_agent.corpus",
    "memory_agent.gateway",
    "memory_agent.memory",
]

[tool.setuptools.package-dir]
memory_agent = "."
