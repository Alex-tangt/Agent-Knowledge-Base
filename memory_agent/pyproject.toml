[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-agent"
version = "0.1.0"
description = "Agent 长期记忆能力包：Markdown 真相源 + 派生索引 + MCP（search/get/add/supersede/archive/reindex）"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "ragcore",
    "python-dotenv",
]

# 可选：本地平面词法路用 fastembed BM25（#40 / ADR-0019 D7）。只有把
# MEMORY_SPARSE_BACKEND 设为 bm25 才需要；不压默认包体（#26）。
[project.optional-dependencies]
bm25 = ["fastembed>=0.4"]
# 可选：文档解析（PDF / DOCX）首装引擎 Docling（#50 / ADR-0027 D3/D5）。
# 只在收录管线解析时用；不进程内 daemon，不压默认包体。
parse = ["docling>=2.0"]

[project.scripts]
memory-agent = "memory_agent.mcp_server:main"
memory-agent-proxy = "memory_agent.proxy:main"
memory-agent-build-index = "memory_agent.build_index:main"
memory-agent-connect = "memory_agent.connect:main"
memory-agent-ingest = "memory_agent.ingest:main"
memory-agent-parse-worker = "memory_agent.parse_worker:main"

[tool.setuptools]
packages = [
    "memory_agent",
    "memory_agent.corpus",
    "memory_agent.gateway",
    "memory_agent.memory",
    "memory_agent.parse",
]

[tool.setuptools.package-dir]
memory_agent = "."
